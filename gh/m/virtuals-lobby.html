  function cleanSnakeWord(token) {
    if (!token || typeof token !== 'string') return token;
    var trimmed = token.trim();
    var lower = trimmed.toLowerCase();

    if (trimmed.indexOf('|sportybet') !== -1 || trimmed.indexOf('|SportyBet') !== -1) {
      var parts = trimmed.split(/\|sportybet/i);
      return (KNOWN_TRANSLATIONS[parts[0].toLowerCase()] || cleanSnakeWord(parts[0])) + ' | SportyBet';
    }
    if (trimmed.indexOf('|') !== -1) {
      var parts = trimmed.split('|');
      var cleaned = [];
      for (var i = 0; i < parts.length; i++) {
        cleaned.push(cleanSnakeWord(parts[i]));
      }
      return cleaned.join(' | ');
    }

    if (/\.(png|jpe?g|svg|webp|gif|js|css|json|woff2?|ttf|html)$/i.test(trimmed)) return token;
    if (/^(https?:\/\/|\/|#|\.)/i.test(trimmed)) return token;

    var parts = trimmed.split('_');
    var cleanedParts = [];
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      if (!p) continue;
      var pLow = p.toLowerCase();
      if (SPECIAL_ACRONYMS[pLow]) {
        cleanedParts.push(SPECIAL_ACRONYMS[pLow]);
      } else {
        cleanedParts.push(p.charAt(0).toUpperCase() + p.slice(1).toLowerCase());
      }
    }
    return cleanedParts.join(' ');
  }

  function cleanString(str) {
    if (typeof str !== 'string' || (str.indexOf('_') === -1 && str.indexOf('|') === -1)) return str;
    if (str.indexOf('data:image') === 0 || str.indexOf('http://') === 0 || str.indexOf('https://') === 0) return str;
    
    var trimmed = str.trim().toLowerCase();
    if (KNOWN_TRANSLATIONS[trimmed]) return KNOWN_TRANSLATIONS[trimmed];

    var res = str;
    if (res.indexOf('title_default') !== -1) {

    if (res.indexOf('|sportybet') !== -1 || res.indexOf('|SportyBet') !== -1) {

    return res;

<script>
(function() {
  function formatGhsAmount(amount) {
    return window.GhsMoney ? window.GhsMoney.format(amount) : Number(amount || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  window.formatGhsAmount = formatGhsAmount;

  function formatGhsAmountParts(amount) {
    if (window.GhsMoney) return window.GhsMoney.formatParts(amount);
    var num = Number(amount || 0);
    var str = num.toFixed(2);
    var parts = str.split('.');
    var intFormatted = Number(parts[0]).toLocaleString('en-US');
    var pesewaStr = '.' + (parts[1] || '00');
    return { intPart: intFormatted, pesewaPart: pesewaStr, full: intFormatted + pesewaStr };
  }
  window.formatGhsAmountParts = formatGhsAmountParts;

  function refreshWalletUI(forcedGhs) {
    try {
      fetch('/pocket/v1/wallet/assetsInfo?_t=' + Date.now())
        .then(function(r) { return r.json(); })
        .then(function(json) {
          if (!json || json.bizCode !== 10000 || !json.data) return;
          var ghs = window.GhsMoney
            ? window.GhsMoney.fromWalletPayload(json.data, forcedGhs)
            : Number((forcedGhs !== undefined) ? forcedGhs : (json.data.balanceGhs != null ? json.data.balanceGhs : 0));
          if (ghs !== undefined && ghs !== null && !isNaN(ghs)) {
            window.__userWalletBalance = ghs;
            try {
              localStorage.setItem('sporty_wallet_balance', String(ghs));
              window.dispatchEvent(new CustomEvent('sporty-balance-updated', { detail: { balance: ghs } }));
            } catch (_) {}

            var parts = formatGhsAmountParts(ghs);
            var formatted = parts.full;
            var intPart = parts.intPart;
            var pesewaPart = parts.pesewaPart;
            var pesewaDigits = pesewaPart.substring(1);

            function isPayoutOrWinDisplay(el) {
              return !!(el.closest && el.closest(
                '#winngin-pop, [data-op="virtual_common_winning_pop"], .main__return, .winning-amount, .winning-section-wrapper, .total-win, .total-return, .total-return-amount, .claim-wrapper'
              ));
            }

            var selectors = [
              '.m-balance',
              '.m-balance-wrapper',
              '.m-nav__balance',
              '.m-header-balance',
              '.m-wallet-balance',
              '.m-cur-balance',
              '.balance',
              '.balance-value',
              '[class*="balance-val"]',
              '[class*="balance_val"]',
              '[class*="balanceValue"]',
              '[data-op*="balance"]',
              '.nav-balance',
              '.user-balance',
              '.m-user-balance'
            ];

            selectors.forEach(function(sel) {
              document.querySelectorAll(sel).forEach(function(el) {
                if (!el || isPayoutOrWinDisplay(el)) return;

                var intEl = el.querySelector('[class*="integer"], [class*="int-part"], [class*="whole"]');
                var decEl = el.querySelector('[class*="decimal"], [class*="dec-part"], [class*="fraction"], small');
                if (intEl && decEl) {
                  intEl.textContent = intPart;
                  decEl.textContent = decEl.textContent.trim().startsWith('.') ? pesewaPart : pesewaDigits;
                  return;
                }

                var valEl = el.querySelector('.value, .balance-value, .money, .m-balance-value');
                if (valEl && !valEl.children.length && !isPayoutOrWinDisplay(valEl)) {
                  valEl.textContent = formatted;
                  return;
                }

                if (!el.children.length) {
                  el.textContent = formatted;
                  return;
                }

                var walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null, false);
                var node;
                var textNodes = [];
                while ((node = walker.nextNode())) {
                  if (node.nodeValue && node.nodeValue.trim()) {
                    textNodes.push(node);
                  }
                }
                
                if (textNodes.length === 1) {
                  var text = textNodes[0].nodeValue;
                  if (text.match(/[0-9,]+\.[0-9]{2}/)) {
                    textNodes[0].nodeValue = text.replace(/[0-9,]+\.[0-9]{2}/, formatted);
                  } else if (text.match(/[0-9,]+/)) {
                    textNodes[0].nodeValue = text.replace(/[0-9,]+/, formatted);
                  }
                } else {
                  var fullNumNode = textNodes.find(function(n) { return /[0-9,]+\.[0-9]{2}/.test(n.nodeValue); });
                  if (fullNumNode) {
                    fullNumNode.nodeValue = fullNumNode.nodeValue.replace(/[0-9,]+\.[0-9]{2}/, formatted);
                  }
                }
              });
            });
          }
        })
        .catch(function() {});
    } catch (_) {}
  }
  window.__refreshWalletUI = refreshWalletUI;
  refreshWalletUI();
  setTimeout(refreshWalletUI, 100);
  setTimeout(refreshWalletUI, 500);
  setInterval(refreshWalletUI, 1000);

  try {
    var walletObserver = new MutationObserver(function() {
      refreshWalletUI();
    });
    if (document.body) {
      walletObserver.observe(document.body, { childList: true, subtree: true });
    } else {
      window.addEventListener('DOMContentLoaded', function() {
        walletObserver.observe(document.body, { childList: true, subtree: true });
      });
    }
  } catch (_) {}
})();
</script>

  <div class="sb-auth-card">
    <button class="sb-auth-close" onclick="window.hideLoginModal()">✕</button>
    <div class="sb-auth-header">
      <div class="sb-auth-logo">SPORTYBET</div>
      <div class="sb-auth-subtitle" id="sb-auth-subtitle-txt">Sign in to your account</div>
    </div>
    <div class="sb-auth-tabs">
      <div class="sb-auth-tab active" id="sb-tab-login" onclick="window.switchAuthTab('login')">LOGIN</div>
      <div class="sb-auth-tab" id="sb-tab-register" onclick="window.switchAuthTab('register')">REGISTER</div>
    </div>
    <form id="sb-auth-form" onsubmit="window.handleAuthSubmit(event)">
      <div class="sb-auth-form-group">
        <label class="sb-auth-label">Mobile Number</label>
        <div class="sb-auth-input-wrapper">
          <div class="sb-auth-prefix">+233</div>
          <input type="tel" id="sb-auth-phone" class="sb-auth-input" placeholder="0591234567" required autocomplete="tel" />
        </div>
      </div>
      <div class="sb-auth-form-group">
        <label class="sb-auth-label">Password / PIN</label>
        <div class="sb-auth-input-wrapper">
          <input type="password" id="sb-auth-password" class="sb-auth-input" placeholder="Enter password" required autocomplete="current-password" />
        </div>
      </div>
      <button type="submit" class="sb-auth-btn" id="sb-auth-submit-btn">LOG IN</button>
      <div class="sb-auth-msg" id="sb-auth-msg"></div>
    </form>
  </div>
</div>

<script>
(function() {
  var _currentTab = 'login';
  var _onAuthSuccessCb = null;

  window.showLoginModal = function(cb, tab) {
    if (cb && typeof cb === 'function') _onAuthSuccessCb = cb;
    if (tab) window.switchAuthTab(tab);
    var overlay = document.getElementById('sb-auth-modal-overlay');
    if (overlay) overlay.classList.add('active');
  };

  window.hideLoginModal = function() {
    var overlay = document.getElementById('sb-auth-modal-overlay');
    if (overlay) overlay.classList.remove('active');
    var msg = document.getElementById('sb-auth-msg');
    if (msg) msg.textContent = '';
  };

  window.switchAuthTab = function(tab) {
    _currentTab = tab;
    var tLogin = document.getElementById('sb-tab-login');
    var tReg = document.getElementById('sb-tab-register');
    var sub = document.getElementById('sb-auth-subtitle-txt');
    var btn = document.getElementById('sb-auth-submit-btn');

    if (tab === 'login') {
      if (tLogin) tLogin.classList.add('active');
      if (tReg) tReg.classList.remove('active');
      if (sub) sub.textContent = 'Sign in to access your wallet & place bets';
      if (btn) btn.textContent = 'LOG IN';
    } else {
      if (tReg) tReg.classList.add('active');
      if (tLogin) tLogin.classList.remove('active');
      if (sub) sub.textContent = 'Create a new account with starting balance';
      if (btn) btn.textContent = 'CREATE ACCOUNT';
    }
  };

  window.handleAuthSubmit = function(e) {
    e.preventDefault();
    var phone = document.getElementById('sb-auth-phone').value.trim();
    var password = document.getElementById('sb-auth-password').value.trim();
    var msg = document.getElementById('sb-auth-msg');
    var btn = document.getElementById('sb-auth-submit-btn');

    if (!phone || !password) {
      if (msg) { msg.className = 'sb-auth-msg error'; msg.textContent = 'Please enter mobile number and password'; }
      return;
    }

    if (btn) btn.disabled = true;
    if (msg) { msg.className = 'sb-auth-msg'; msg.textContent = 'Authenticating with Supabase...'; }

    var endpoint = (_currentTab === 'register') ? '/api/gh/patron/register' : '/api/gh/patron/login';

    fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone: phone, password: password })
    })
    .then(function(r) { return r.json(); })
    .then(function(res) {
      if (btn) btn.disabled = false;
      if (res && res.bizCode === 10000 && res.data) {
        if (msg) { msg.className = 'sb-auth-msg success'; msg.textContent = 'Logged in successfully!'; }
        setTimeout(function() {
          window.hideLoginModal();
          window.checkAuthStatus();
          if (_onAuthSuccessCb) { _onAuthSuccessCb(); _onAuthSuccessCb = null; }
        }, 500);
      } else {
        if (msg) { msg.className = 'sb-auth-msg error'; msg.textContent = res.message || 'Authentication failed'; }
      }
    })
    .catch(function(err) {
      if (btn) btn.disabled = false;
      if (msg) { msg.className = 'sb-auth-msg error'; msg.textContent = 'Connection error. Please try again.'; }
    });
  };

  window.performLogout = function() {
    fetch('/api/gh/patron/logout', { method: 'POST' })
      .then(function() {
        window.checkAuthStatus();
      })
      .catch(function() {
        window.checkAuthStatus();
      });
  };

  window.updateHeaderAndMePageAuthUI = function(isLoggedIn, userData) {
    var headerAuthContainers = document.querySelectorAll('.m-header-user, .m-nav-user, .user-box, .m-user-info, .user-center, .m-header-right, [class*="header-user"], [class*="nav-user"]');
    headerAuthContainers.forEach(function(container) {
      if (!container) return;
      if (!isLoggedIn) {
        container.innerHTML = 
          '<div class="sb-auth-cta-bar">' +
            '<button type="button" class="sb-btn-join-now" onclick="window.showLoginModal(null, \'register\')">Join Now</button>' +
            '<button type="button" class="sb-btn-login" onclick="window.showLoginModal(null, \'login\')">Log in</button>' +
          '</div>';
      } else {
        var phone = (userData && (userData.phone || userData.maskedPhone)) ? (userData.phone || userData.maskedPhone) : '0591226018';
        container.innerHTML = 
          '<div class="sb-auth-cta-bar">' +
            '<span style="font-size:13px; font-weight:700; color:#fff;">' + phone + '</span>' +
            '<a href="/gh/m/withdraw" class="sb-btn-join-now" style="background:#00e676!important; color:#000!important;">Deposit</a>' +
            '<button type="button" class="sb-btn-login" onclick="window.performLogout()">Logout</button>' +
          '</div>';
      }
    });

    var meContainers = document.querySelectorAll('#me-page, .wap-me, .wap-profile, [class*="me-page"], [class*="personal_page"]');
    meContainers.forEach(function(meBox) {
      if (!meBox) return;
      var authSection = meBox.querySelector('.sb-me-auth-section');
      if (!authSection) {
        authSection = document.createElement('div');
        authSection.className = 'sb-me-auth-section';
        meBox.insertBefore(authSection, meBox.firstChild);
      }
      if (!isLoggedIn) {
        authSection.innerHTML = 
          '<div class="sb-me-auth-card">' +
            '<h3 style="margin:0 0 8px; color:#fff; font-size:18px;">Welcome to SportyBet</h3>' +
            '<p style="margin:0 0 16px; color:#aaa; font-size:13px;">Join millions of players or log in to place bets & check balance</p>' +
            '<div class="sb-auth-cta-bar" style="justify-content:center;">' +
              '<button type="button" class="sb-btn-join-now" style="padding:10px 24px; font-size:14px;" onclick="window.showLoginModal(null, \'register\')">Join Now</button>' +
              '<button type="button" class="sb-btn-login" style="padding:10px 24px; font-size:14px;" onclick="window.showLoginModal(null, \'login\')">Log in</button>' +
            '</div>' +
          '</div>';
      } else {
        var phone = (userData && (userData.phone || userData.maskedPhone)) ? (userData.phone || userData.maskedPhone) : '0591226018';
        authSection.innerHTML = 
          '<div class="sb-me-user-card">' +
            '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">' +
              '<div>' +
                '<div style="font-size:16px; font-weight:800; color:#00e676;">' + phone + '</div>' +
                '<div style="font-size:12px; color:#888;">Standard User Account</div>' +
              '</div>' +
              '<button type="button" class="sb-btn-login" style="padding:6px 12px; font-size:12px;" onclick="window.performLogout()">Log Out</button>' +
            '</div>' +
            '<div style="display:flex; gap:10px;">' +
              '<a href="/gh/m/withdraw" class="sb-btn-join-now" style="flex:1;">Deposit</a>' +
              '<a href="/gh/m/withdraw" class="sb-btn-login" style="flex:1;">Withdraw</a>' +
            '</div>' +
          '</div>';
      }
    });
  };

  window.checkAuthStatus = function() {
    fetch('/api/gh/patron/account/info?_t=' + Date.now())
      .then(function(r) { return r.json(); })
      .then(function(res) {
        var isLoggedIn = (res && res.bizCode === 10000 && res.data);
        if (typeof window.updateHeaderAndMePageAuthUI === 'function') {
          window.updateHeaderAndMePageAuthUI(isLoggedIn, res ? res.data : null);
        }
        if (isLoggedIn && typeof window.refreshWalletUI === 'function') {
          window.refreshWalletUI();
        }
      })
      .catch(function() {
        if (typeof window.updateHeaderAndMePageAuthUI === 'function') {
          window.updateHeaderAndMePageAuthUI(false, null);
        }
      });
  };

  document.addEventListener('click', function(e) {
    var target = e.target.closest('[href*="deposit"], [href*="withdraw"], .m-btn--deposit, .m-btn--withdraw, [data-op="deposit"], [data-op="withdraw"], [href*="login"], [href*="register"], [href*="signup"], .btn-login, .btn-register, .login-btn, .register-btn, .btn-join, [data-op="join"], [data-op="login"]');
    if (target) {
      var txt = target.textContent || '';
      var href = target.getAttribute('href') || '';
      var isRegisterBtn = txt.indexOf('Join') !== -1 || txt.indexOf('Register') !== -1 || href.indexOf('register') !== -1 || href.indexOf('signup') !== -1;
      var defaultTab = isRegisterBtn ? 'register' : 'login';

      fetch('/api/gh/patron/account/info')
        .then(function(r) { return r.json(); })
        .then(function(res) {
          if (!res || res.bizCode !== 10000) {
            e.preventDefault();
            e.stopPropagation();
            window.showLoginModal(function() {
              if (href && !href.includes('login') && !href.includes('register')) {
                window.location.href = href;
              }
            }, defaultTab);
          }
        }).catch(function() {});
    }
  }, true);

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', window.checkAuthStatus);
  } else {
    window.checkAuthStatus();
  }
})();
</script>
</body>
</html>
