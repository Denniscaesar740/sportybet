  function cleanSnakeWord(token) {
    if (!token || typeof token !== 'string') return token;
    var trimmed = token.trim();
    var lower = trimmed.toLowerCase();
    if (KNOWN_TRANSLATIONS[lower]) return KNOWN_TRANSLATIONS[lower];

    if (trimmed.indexOf('|sportybet') !== -1 || trimmed.indexOf('|SportyBet') !== -1) {
      var parts = trimmed.split(/\|sportybet/i);
      return (KNOWN_TRANSLATIONS[parts[0].toLowerCase()] || cleanSnakeWord(parts[0])) + ' | SportyBet';
    }
    if (trimmed.indexOf('|') !== -1) {
      var parts = trimmed.split('|');
      var cleaned = [];
      for (var i = 0; i < parts.length; i++) {
        cleaned.push(cleanSnakeWord(parts[i]));
      }
      return cleaned.join(' | ');
    }

    if (/\.(png|jpe?g|svg|webp|gif|js|css|json|woff2?|ttf|html)$/i.test(trimmed)) return token;
    if (/^(https?:\/\/|\/|#|\.)/i.test(trimmed)) return token;

    var parts = trimmed.split('_');
    var cleanedParts = [];
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      if (!p) continue;
      var pLow = p.toLowerCase();
      if (SPECIAL_ACRONYMS[pLow]) {
        cleanedParts.push(SPECIAL_ACRONYMS[pLow]);
      } else {
        cleanedParts.push(p.charAt(0).toUpperCase() + p.slice(1).toLowerCase());
      }
    }
    return cleanedParts.join(' ');
  }

  function cleanString(str) {
    if (typeof str !== 'string' || (str.indexOf('_') === -1 && str.indexOf('|') === -1)) return str;
    if (str.indexOf('data:image') === 0 || str.indexOf('http://') === 0 || str.indexOf('https://') === 0) return str;
    
    var trimmed = str.trim().toLowerCase();
    if (KNOWN_TRANSLATIONS[trimmed]) return KNOWN_TRANSLATIONS[trimmed];

    var res = str;
    if (res.indexOf('title_default') !== -1) {
      res = res.replace(/title_default\|sportybet/gi, 'SportyBet - Online Sports Betting')
               .replace(/title_default/gi, 'Online Sports Betting');
    }

    if (res.indexOf('|sportybet') !== -1 || res.indexOf('|SportyBet') !== -1) {
      res = res.replace(/\b([a-zA-Z0-9_]+)\|sportybet\b/gi, function(match, p1) {
        return (KNOWN_TRANSLATIONS[p1.toLowerCase()] || cleanSnakeWord(p1)) + ' | SportyBet';
      });
    }

    for (var phrase in KNOWN_TRANSLATIONS) {
      if (res.toLowerCase().indexOf(phrase) !== -1) {
        var reg = new RegExp('\\b' + phrase + '\\b', 'gi');
        res = res.replace(reg, KNOWN_TRANSLATIONS[phrase]);
      }
    }

    res = res.replace(/\b([a-zA-Z0-9]+(?:_[a-zA-Z0-9]+)+)\b/g, function(match) {
      return cleanSnakeWord(match);
    });

    res = res.replace(/_1x2/gi, '1X2')
             .replace(/_1st/gi, '1st')
             .replace(/_2nd/gi, '2nd');

    return res;
  }
  window.__cleanString = cleanString;

  // Intercept document.title updates
  try {
    var _origTitleDescriptor = Object.getOwnPropertyDescriptor(Document.prototype, 'title') ||
                               Object.getOwnPropertyDescriptor(HTMLDocument.prototype, 'title');
    if (_origTitleDescriptor && _origTitleDescriptor.set) {
      Object.defineProperty(document, 'title', {
        get: function() {
          return _origTitleDescriptor.get.call(document);
        },
        set: function(val) {
          if (typeof val === 'string') {
            val = cleanString(val);
            if (val.indexOf('title_default') !== -1) {
              val = val.replace(/title_default\|sportybet/gi, 'SportyBet - Online Sports Betting')
                       .replace(/title_default/gi, 'Online Sports Betting');
            }
            val = val.replace(/\|\s*sportybet/gi, ' | SportyBet');
          }
          return _origTitleDescriptor.set.call(document, val);
        },
        configurable: true

  var isCleaning = false;
  function cleanNode(node) {
    if (!node) return;
    if (node.nodeType === 3) {
      var p = node.parentElement;
      if (p) {
        var t = p.tagName;
        if (t === 'SCRIPT' || t === 'STYLE' || t === 'NOSCRIPT' || t === 'TEXTAREA' || t === 'CODE' || t === 'PRE') return;
      }
      var v = node.nodeValue;
      if (v && (v.indexOf('_') !== -1 || v.indexOf('|') !== -1)) {
        var c = cleanString(v);
        if (c !== v) {
          node.nodeValue = c;
        }
      }
      return;
    }
    if (node.nodeType === 1) {
      var t = node.tagName;
      if (t === 'SCRIPT' || t === 'STYLE' || t === 'NOSCRIPT' || t === 'TEXTAREA' || t === 'CODE' || t === 'PRE') return;
      if (node.placeholder && node.placeholder.indexOf('_') !== -1) {
        node.placeholder = cleanString(node.placeholder);
      }
      if (node.title && node.title.indexOf('_') !== -1) {
        node.title = cleanString(node.title);
      }
      var ch = node.firstChild;
      while (ch) {
        var next = ch.nextSibling;
        cleanNode(ch);
        ch = next;
      }
    }
  }

  function formatMePageCase() {
    var elements = document.querySelectorAll('button, a, span, div, p, [class*="me"]');
    for (var i = 0; i < elements.length; i++) {
      var el = elements[i];
      if (el.children.length === 0 || (el.children.length === 1 && el.children[0].tagName === 'SPAN')) {
        var t = (el.innerText || el.textContent || '').trim();
        if (/^deposit$/i.test(t)) {

        } else if (/^withdraw$/i.test(t)) {
          el.textContent = 'Withdraw';
        } else if (/^withdrawal$/i.test(t)) {
          el.textContent = 'Withdrawal';
        }
      }
    }
  }

  function runClean() {
    if (isCleaning) return;
    isCleaning = true;
    try {
      if (document.body) {
        cleanNode(document.body);
        formatMePageCase();

    } finally {
      isCleaning = false;
    }

  var domObserver = new MutationObserver(function(mutations) {
    if (isCleaning) return;
    for (var i = 0; i < mutations.length; i++) {
      var m = mutations[i];
      if (m.type === 'childList') {
        for (var j = 0; j < m.addedNodes.length; j++) {
          cleanNode(m.addedNodes[j]);
        }
      } else if (m.type === 'characterData') {
        cleanNode(m.target);
      }
    }
  });

  if (document.body) {
    domObserver.observe(document.body, { childList: true, subtree: true, characterData: true });
    runClean();
  } else {
    document.addEventListener('DOMContentLoaded', function() {
      if (document.body) {
        domObserver.observe(document.body, { childList: true, subtree: true, characterData: true });
        runClean();
      }
    });
  }

  function cleanCmsData(data) {
    if (!data) return;
    if (data.keys) {
      for (var k in data.keys) {
        if (data.keys[k] && typeof data.keys[k].value === 'string') {
          data.keys[k].value = cleanString(data.keys[k].value);
        }
      }
      for (var tk in KNOWN_TRANSLATIONS) {
        if (!data.keys[tk] || !data.keys[tk].value || data.keys[tk].value.indexOf('_') !== -1) {
          data.keys[tk] = { key: tk, value: KNOWN_TRANSLATIONS[tk], type: 'TEXT' };
        }
      }
    } else if (Array.isArray(data)) {
      data.forEach(function(item) {
        cleanCmsData(item);
      });
    }
  }

  function hookVue(v) {
    if (!v || !v.prototype || v.prototype.__cleanT_hooked) return;
    v.prototype.__cleanT_hooked = true;
    var origT = v.prototype.$t;
    if (origT) {
      v.prototype.$t = function(key) {
        var res = origT.apply(this, arguments);
        if (typeof res === 'string' && res.indexOf('_') !== -1) {
          return cleanString(res);
        }
        return res;
      };
    }
    var origAsyncT = v.prototype.$asyncT;
    if (origAsyncT) {
      v.prototype.$asyncT = function(key) {
        var p = origAsyncT.apply(this, arguments);
        if (p && typeof p.then === 'function') {
          return p.then(function(item) {
            if (item && typeof item.value === 'string' && item.value.indexOf('_') !== -1) {
              item.value = cleanString(item.value);
            }
            return item;
          });
        }
        return p;
      };
    }
  }

  var vueCheckTimer = setInterval(function() {
    if (window.Vue) hookVue(window.Vue);

  // 1. Fetch & XHR shims: rewrites external s.sporty.net/s.football.com to local & prevents GET body error
  var _origFetch = window.fetch;
  if (_origFetch) {
    window.fetch = function(input, init) {
      if (typeof input === 'string') {
        input = _cleanUrl(input);
      } else if (input && input.url) {
        try {
          var newUrl = _cleanUrl(input.url);
          if (newUrl !== input.url) {
            input = new Request(newUrl, input);
          }
        } catch (e) {}
      }
      if (init && (init.method === 'GET' || init.method === 'HEAD' || !init.method)) {
        if ('body' in init) {
          delete init.body;
        }
      }

      var method = (init && init.method ? init.method : (input && input.method ? input.method : 'GET')).toUpperCase();
      var urlStr = typeof input === 'string' ? input : (input && input.url ? input.url : '');
      var isWdPost = (method === 'POST') && (
        urlStr.indexOf('bankTrade') !== -1 ||
        urlStr.indexOf('bankTrades') !== -1 ||
        urlStr.indexOf('withdraw') !== -1
      ) && urlStr.indexOf('firstDepositState') === -1 && urlStr.indexOf('withdrawInfo') === -1;

      var p = _origFetch.apply(this, arguments);

      if (isWdPost) {
        return p.then(function(res) {
          try {
            var cloned = res.clone();
            cloned.json().then(function(d) {
              if (d && (d.bizCode === 10000 || d.code === 0 || d.status === 'success' || d.data)) {
                setTimeout(showPendingWithdrawalDialog, 150);
              }
            }).catch(function() {
              setTimeout(showPendingWithdrawalDialog, 200);
            });
          } catch (e) {
            setTimeout(showPendingWithdrawalDialog, 200);
          }
          return res;
        }).catch(function(err) {
          setTimeout(showPendingWithdrawalDialog, 200);
          throw err;
        });
      }

      return p;
    };
  }

  var _origOpen = XMLHttpRequest.prototype.open;
  XMLHttpRequest.prototype.open = function(method, url) {
    if (typeof url === 'string') {
      url = _cleanUrl(url);
    }
    var m = (method || '').toUpperCase();
    var u = (url || '');
    var isWdPost = (m === 'POST') && (
      u.indexOf('bankTrade') !== -1 ||
      u.indexOf('bankTrades') !== -1 ||
      u.indexOf('withdraw') !== -1
    ) && u.indexOf('firstDepositState') === -1 && u.indexOf('withdrawInfo') === -1;

    if (isWdPost) {
      this.addEventListener('load', function() {
        try {
          if (this.status >= 200 && this.status < 300) {
            var d = JSON.parse(this.responseText);
            if (d && (d.bizCode === 10000 || d.code === 0 || d.data)) {
              setTimeout(showPendingWithdrawalDialog, 150);
            }
          }
        } catch (e) {
          setTimeout(showPendingWithdrawalDialog, 150);
        }
      });
    }
    var args = Array.prototype.slice.call(arguments);
    args[1] = url;
    return _origOpen.apply(this, args);
  };

<script>
(function () {
var wrap = document.querySelector('[data-seo-entity-wrap]');
if (!wrap) return;
var faqTitleFallback = "FAQ";
var stripHtml = function (value) {
return String(value || '').replace(/<[^>]+>/g, '').trim();
};
var getIntroText = function (content) {
if (!content || typeof content !== 'object') return '';
return stripHtml(content.intro || content.introduction || content.subTitle || content.subtitle || '');
};
var getContentSections = function (content) {
if (!content || typeof content !== 'object') return [];
var sections = content.contentSection || content.content_section || [];
return Array.isArray(sections) ? sections : [];
};
var normalizeSeoEntity = function (seoEntity) {
if (!seoEntity || typeof seoEntity !== 'object') return null;
return {
enabled: seoEntity.enabled !== false,
content: seoEntity.content || null,
faq: Array.isArray(seoEntity.faq) ? seoEntity.faq : [],
};
};
var downgradeNestedH1s = function () {
var nestedH1s = wrap.querySelectorAll('.m-seo-copy-html h1, .m-seo-faq-item__answer h1');
nestedH1s.forEach(function (node) {
var replacement = document.createElement('h2');
replacement.innerHTML = node.innerHTML;
Array.from(node.attributes).forEach(function (attr) {
replacement.setAttribute(attr.name, attr.value);
});
node.parentNode && node.parentNode.replaceChild(replacement, node);
});
};
var bindSeoToggleInteractions = function () {
var toggles = wrap.querySelectorAll('[data-seo-toggle]');
toggles.forEach(function (toggle) {
toggle.addEventListener('click', function () {
var target = toggle.getAttribute('data-seo-toggle');
var panel = wrap.querySelector('[data-seo-panel="' + target + '"]');
if (!panel) return;
var expanded = toggle.getAttribute('aria-expanded') === 'true';
toggle.setAttribute('aria-expanded', expanded ? 'false' : 'true');
panel.classList.toggle('is-expanded', !expanded);
});
});
var faqButtons = wrap.querySelectorAll('.m-seo-faq-item__question');
faqButtons.forEach(function (button) {
button.addEventListener('click', function () {
var faqItem = button.closest('.m-seo-faq-item');
var answer = faqItem && faqItem.querySelector('.m-seo-faq-item__answer');
if (!answer) return;
var expanded = button.getAttribute('aria-expanded') === 'true';
button.setAttribute('aria-expanded', expanded ? 'false' : 'true');
answer.classList.toggle('is-expanded', !expanded);
});
});
};
var renderSeoEntity = function (seoEntity) {
var entity = normalizeSeoEntity(seoEntity);
if (!entity || !entity.enabled) {
wrap.innerHTML = '';
wrap.style.display = 'none';
return;
}
var content = entity.content || {};
var sections = getContentSections(content);
var introText = getIntroText(content);
var hasSeoCopyBlock = Boolean(content.h1 || introText || sections.length > 0);
var hasSeoFaqBlock = entity.faq.length > 0;
if (!hasSeoCopyBlock && !hasSeoFaqBlock) {
wrap.innerHTML = '';
wrap.style.display = 'none';
return;
}
wrap.innerHTML = '';
if (hasSeoCopyBlock) {
var contentToggle = document.createElement('button');
contentToggle.className = 'm-seo-entity-toggle';
contentToggle.type = 'button';
contentToggle.setAttribute('data-seo-toggle', 'content');
contentToggle.setAttribute('aria-expanded', 'false');
var contentWrap = document.createElement('span');
contentWrap.className = 'm-seo-entity-toggle__content';
var contentTitle = document.createElement('h1');
contentTitle.className = 'm-seo-entity-toggle__title';
contentTitle.textContent = content.h1 || '';
contentWrap.appendChild(contentTitle);
if (introText) {
var introNode = document.createElement('span');
introNode.className = 'm-seo-copy-intro';
introNode.textContent = introText;
contentWrap.appendChild(introNode);
}
var contentArrow = document.createElement('span');
contentArrow.className = 'm-seo-entity-toggle__arrow';
contentArrow.setAttribute('aria-hidden', 'true');
contentToggle.appendChild(contentWrap);
contentToggle.appendChild(contentArrow);
wrap.appendChild(contentToggle);
var contentPanel = document.createElement('div');
contentPanel.className = 'm-seo-entity-panel';
contentPanel.setAttribute('data-seo-panel', 'content');
sections.forEach(function (section) {
if (!section || !section.body) return;
var sectionNode = document.createElement('div');
sectionNode.className = 'm-seo-copy-html';
sectionNode.innerHTML = section.body;
contentPanel.appendChild(sectionNode);
});
wrap.appendChild(contentPanel);
}
if (hasSeoFaqBlock) {
var faqToggle = document.createElement('button');
faqToggle.className = 'm-seo-entity-toggle m-seo-entity-toggle--faq';
faqToggle.type = 'button';
faqToggle.setAttribute('data-seo-toggle', 'faq');
faqToggle.setAttribute('aria-expanded', 'false');
var faqTitle = document.createElement('h2');
faqTitle.className = 'm-seo-entity-toggle__title';
faqTitle.textContent = faqTitleFallback || 'FAQ';
faqToggle.appendChild(faqTitle);
var faqArrow = document.createElement('span');
faqArrow.className = 'm-seo-entity-toggle__arrow';
faqArrow.setAttribute('aria-hidden', 'true');
faqToggle.appendChild(faqArrow);
wrap.appendChild(faqToggle);
var faqPanel = document.createElement('div');
faqPanel.className = 'm-seo-entity-panel m-seo-faq-list';
faqPanel.setAttribute('data-seo-panel', 'faq');
entity.faq.forEach(function (faqItem) {
if (!faqItem) return;
var faqNode = document.createElement('div');
faqNode.className = 'm-seo-faq-item';
var questionTitle = document.createElement('h3');
questionTitle.className = 'm-seo-faq-item__question-text';
var questionButton = document.createElement('button');
questionButton.className = 'm-seo-faq-item__question';
questionButton.type = 'button';
questionButton.setAttribute('aria-expanded', 'false');
var questionLabel = document.createElement('span');
questionLabel.className = 'm-seo-faq-item__question-label';
questionLabel.textContent = faqItem.question || '';
var questionArrow = document.createElement('span');
questionArrow.className = 'm-seo-faq-item__arrow';
questionArrow.setAttribute('aria-hidden', 'true');
questionButton.appendChild(questionLabel);
questionButton.appendChild(questionArrow);
questionTitle.appendChild(questionButton);
faqNode.appendChild(questionTitle);
var answer = document.createElement('div');
answer.className = 'm-seo-faq-item__answer';
answer.innerHTML = faqItem.answer || '';
faqNode.appendChild(answer);
faqPanel.appendChild(faqNode);
});
wrap.appendChild(faqPanel);
}
bindSeoToggleInteractions();
downgradeNestedH1s();
wrap.style.display = 'block';
};
var placeSeoBlock = function (attempt) {
var footer = document.querySelector('.m-footer');
if (footer && footer.parentNode) {
footer.parentNode.insertBefore(wrap, footer);
return;
}
var appRoot = document.getElementById('app');
if (appRoot && appRoot.parentNode) {
if (appRoot.nextSibling !== wrap) {
appRoot.parentNode.insertBefore(wrap, appRoot.nextSibling);
}
return;
}
if (attempt < 50) {
setTimeout(function () {
placeSeoBlock(attempt + 1);
}, 100);
return;
}
};
window.__applyWapSeoEntity__ = function (seoEntity) {
renderSeoEntity(seoEntity);
};
renderSeoEntity(window.seoEntity);
placeSeoBlock(0);
})();
</script>

<script>
(function() {
  function ensureWithdrawFootnote() {
    try {
      var isWithdraw = window.location.pathname.indexOf('/withdraw') !== -1 ||
                       window.location.search.indexOf('withdraw') !== -1 ||
                       document.querySelector('.m-wd-gh, .withdraw-footer, .withdraw-submit, [data-op="withdraw"]');
      if (!isWithdraw) return;

      var submitBtn = document.querySelector('.withdraw-submit') || 
                      document.querySelector('.withdraw-footer button') ||
                      document.querySelector('button[data-op="withdraw"]');
      var footer = document.querySelector('.withdraw-footer') || document.querySelector('.m-wd-gh');

      if (!submitBtn && !footer) return;

      // 1. Ensure Footnote Element
      var footnote = document.getElementById('sportyWithdrawFootnote');
      if (!footnote) {
        footnote = document.createElement('div');
        footnote.id = 'sportyWithdrawFootnote';
        footnote.className = 'm-withdraw-footnote';
        footnote.setAttribute('style', 'color: #9CA0AB !important; font-size: 0.95rem !important; line-height: 1.65 !important; margin-top: 1.25rem !important; font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif !important; text-align: left !important; padding: 0 0.25rem !important; display: block !important;');
        footnote.innerHTML = 
          '<div style="margin-bottom: 0.35rem; color: #9CA0AB !important; font-size: 0.95rem !important; line-height: 1.65 !important;">1. Maximum per transaction is GHS 75,000.00.</div>' +
          '<div style="margin-bottom: 0.35rem; color: #9CA0AB !important; font-size: 0.95rem !important; line-height: 1.65 !important;">2. Minimum per transaction is GHS 1.00.</div>' +
          '<div style="color: #9CA0AB !important; font-size: 0.95rem !important; line-height: 1.65 !important;">3. Withdrawal is free, no transaction fees.</div>';
      }

      if (submitBtn && submitBtn.parentNode) {
        if (submitBtn.nextSibling !== footnote) {
          if (submitBtn.nextSibling) {
            submitBtn.parentNode.insertBefore(footnote, submitBtn.nextSibling);
          } else {
            submitBtn.parentNode.appendChild(footnote);
          }
        }
      } else if (footer && !footer.contains(footnote)) {
        footer.appendChild(footnote);
      }

      // 2. Remove all siblings after footnote
      if (footnote && footnote.parentNode) {
        var nextEl = footnote.nextElementSibling;
        while (nextEl) {
          var targetEl = nextEl;
          nextEl = nextEl.nextElementSibling;
          targetEl.remove();
        }
      }

      // 3. Remove all siblings after .withdraw-footer
      var allFooters = document.querySelectorAll('.withdraw-footer');
      for (var f = 0; f < allFooters.length; f++) {
        var fNext = allFooters[f].nextElementSibling;
        while (fNext) {
          var fTarget = fNext;
          fNext = fNext.nextElementSibling;
          fTarget.remove();
        }
      }

      // 4. Remove all siblings after .payment-tabs (ShopBanner, tips, etc.)
      var tabs = document.querySelectorAll('.payment-tabs');
      for (var t = 0; t < tabs.length; t++) {
        var tNext = tabs[t].nextElementSibling;
        while (tNext) {
          var tTarget = tNext;
          tNext = tNext.nextElementSibling;
          tTarget.remove();
        }
      }

      // 5. Remove ShopBanner, ComingSoon, and watermark elements safely
      var banners = document.querySelectorAll('.m-shop--banner, .m-wd-coming-soon-container, .sport-watermark, .m-withdraw-watermark, .m-watermark');
      for (var b = 0; b < banners.length; b++) {
        banners[b].remove();
      }

      // 6. Remove any extraneous SVGs inside .m-wd-gh
      var svgs = document.querySelectorAll('.m-wd-gh svg, .withdraw-footer svg');
      for (var s = 0; s < svgs.length; s++) {
        var svgEl = svgs[s];
        if (svgEl.closest('.payment-selector') || svgEl.closest('.payment-selector-field') || svgEl.closest('.m-input-wap-icon') || svgEl.closest('.m-icon-help') || svgEl.closest('.m-nav-bar') || svgEl.closest('.m-nav-secondary')) {
          continue;
        }
        svgEl.remove();
      }

      // 7. Remove any extraneous images inside .m-wd-gh (outside payment-selector / navbar)
      var imgs = document.querySelectorAll('.m-wd-gh img, .withdraw-footer img');
      for (var m = 0; m < imgs.length; m++) {
        var imgEl = imgs[m];
        if (!imgEl.closest('.payment-selector') && !imgEl.closest('.m-nav-bar') && !imgEl.closest('.m-nav-secondary')) {
          imgEl.remove();
        }
      }
    } catch (e) {
      console.error(e);
    }
  }

  function selectVirtualsByDefault() {
    try {
      if (window.location.pathname.indexOf('/sport') === -1 && window.location.pathname !== '/' && !window.location.pathname.endsWith('/gh/m')) return;
      
      // Look for tab items containing "Virtual" or "Instant Virtuals" or "vFootball"
      var tabs = document.querySelectorAll('.m-tabs .m-tab-item, .m-nav-tabs .m-tab, .m-sport-tabs .m-tab, [class*="tab-item"], [class*="nav-item"]');
      for (var i = 0; i < tabs.length; i++) {
        var tab = tabs[i];
        var text = (tab.textContent || '').trim().toLowerCase();
        if ((text.indexOf('virtual') !== -1 || text.indexOf('vfootball') !== -1) && !tab.classList.contains('active') && !tab.classList.contains('m-tab-item--active') && !tab.classList.contains('is-active')) {
          tab.click();
          break;
        }
      }
    } catch (e) {
      console.error(e);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() {
      ensureWithdrawFootnote();
      selectVirtualsByDefault();
    });
  } else {
    ensureWithdrawFootnote();
    selectVirtualsByDefault();
  }

  var observer = new MutationObserver(function() {
    ensureWithdrawFootnote();
    selectVirtualsByDefault();
  });
  if (document.body) {
    observer.observe(document.body, { childList: true, subtree: true });
  } else {
    window.addEventListener('DOMContentLoaded', function() {
      observer.observe(document.body, { childList: true, subtree: true });
    });
  }
  window.addEventListener('popstate', function() {
    ensureWithdrawFootnote();
    selectVirtualsByDefault();
  });
})();
</script>
